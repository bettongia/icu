workflows:

  # ---------------------------------------------------------------------------
  # Android integration tests — runs on pushes to main only.
  # Boots an x86_64 Android 14 emulator, then runs the Flutter integration
  # test suite from integration_test_app/ against the real Android ICU.
  # ---------------------------------------------------------------------------
  android-integration:
    name: Android Integration Tests
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      flutter: stable
    scripts:
      - name: Create AVD
        script: |
          sdkmanager --install "system-images;android-34;google_apis;arm64-v8a" > /dev/null
          echo "no" | avdmanager create avd --force \
            --name "ci_avd" \
            --package "system-images;android-34;google_apis;arm64-v8a"
      - name: Start emulator
        script: |
          $ANDROID_HOME/emulator/emulator \
            -avd ci_avd \
            -no-audio \
            -no-boot-anim \
            -no-window &
          timeout 120 adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done; input keyevent 82'
      - name: Run integration tests
        script: make android_test DEVICE=emulator-5554

  # ---------------------------------------------------------------------------
  # iOS integration tests — runs on pushes to main only.
  # Boots the first available iPhone simulator, then runs the Flutter
  # integration test suite from integration_test_app/.
  # ---------------------------------------------------------------------------
  ios-integration:
    name: iOS Integration Tests
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Boot iOS simulator
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devs in json.load(sys.stdin)['devices'].items():
              for d in devs:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      exit()
          ")
          xcrun simctl boot "$UDID"
      - name: Run integration tests
        script: make ios_test
