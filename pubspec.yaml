name: betto_icu
description: >
  Unicode text tokenization for Dart — Tokenizer interface, IcuTokenizer
  (system ICU FFI, UAX #29), and RegExpTokenizer (pure Dart, Latin fallback).
version: 0.1.0
homepage: https://github.com/bettongia/icu

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
